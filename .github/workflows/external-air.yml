name: AltNet external Air call
on:
  push:
    branches: [qa/ubuntu-external-air-20261127]
    paths:
      - '.github/workflows/external-air.yml'
      - 'tests/external-air-*.py'
      - 'tests/ubuntu-*.py'
      - 'tests/tor-native-ui.py'
      - 'scripts/install-ubuntu-browser.sh'

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install AltNet, Tor and Yggdrasil
        env:
          QA_TRANSFER: ${{ secrets.ALTNET_EXTERNAL_AIR_QA_20261127 }}
        run: /usr/bin/python3 -IBu tests/external-air-guest.py install
      - name: Check media retries, pinned peers and call recovery against the installed release
        run: |
          /usr/bin/python3 -IB tests/external-air-retry.py
          checks=$(mktemp -d)
          mkdir -p "$checks/tests" "$checks/browser/tor-browser"
          ln -s /opt/altnet-browser/Browser/altnet-linux "$checks/browser/tor-browser/linux"
          cp tests/test-join-link.py "$checks/tests/"
          /usr/bin/python3 -IB "$checks/tests/test-join-link.py"
      - name: Prepare isolated display and audio devices
        run: |
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=90 install -y --no-install-recommends xvfb xauth openbox xdotool pulseaudio espeak-ng dbus-x11
      - name: Verify automatic duplex audio recovery, then restart and call again
        id: audio
        env:
          QA_TRANSFER: ${{ secrets.ALTNET_EXTERNAL_AIR_QA_20261127 }}
        run: /usr/bin/python3 -IBu tests/external-air-guest.py call
      - name: Require duplex speaker audio within ten seconds of all three restorations
        env:
          TEN_SECONDS: ${{ steps.audio.outputs.ten_seconds }}
        run: test "$TEN_SECONDS" = true

